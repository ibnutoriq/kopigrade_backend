service: kopigrade_backend
image: YOUR_DOCKERHUB_USERNAME/kopigrade_backend

servers:
  web:
    - YOUR_ORACLE_IP

# Uncomment and fill in when you have a domain name pointing to the server.
# Let's Encrypt requires a real domain — does not work with bare IP.
# proxy:
#   ssl: true
#   host: yourdomain.com

registry:
  username: YOUR_DOCKERHUB_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - GOOGLE_API_KEY
    - KOPIGRADE_BACKEND_DATABASE_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: "true"
    JOB_CONCURRENCY: "2"
    DB_HOST: kopigrade_backend-db
    CORS_ALLOWED_ORIGINS: "http://YOUR_ORACLE_IP"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs -f
  dbc:     app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "kopigrade_backend_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: arm64

accessories:
  db:
    image: postgres:16
    host: YOUR_ORACLE_IP
    port: 5432
    env:
      clear:
        POSTGRES_USER: kopigrade_backend
        POSTGRES_DB: kopigrade_backend_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/init.sql
    directories:
      - data:/var/lib/postgresql/data
