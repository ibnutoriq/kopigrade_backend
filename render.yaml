services:
  - type: web
    name: kopigrade-backend
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kopigrade-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: JOB_CONCURRENCY
        value: "2"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

databases:
  - name: kopigrade-db
    plan: free
    databaseName: kopigrade_production
    user: kopigrade
